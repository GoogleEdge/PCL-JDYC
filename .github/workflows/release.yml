name: Release - JDYC Skin Station
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'Plain Craft Launcher 2/Modules/ModSecret.vb'
      - 'Plain Craft Launcher 2/Modules/ModJdyc.vb'
      - 'Plain Craft Launcher 2/Modules/Minecraft/ModLaunch.vb'
      - 'Plain Craft Launcher 2/Modules/ModMain.vb'
      - 'Plain Craft Launcher 2/FormMain.xaml.vb'
      - 'Plain Craft Launcher 2/Pages/PageLaunch/PageLaunchLeft.xaml'
      - 'Plain Craft Launcher 2/Pages/PageLaunch/PageLaunchLeft.xaml.vb'
      - 'Plain Craft Launcher 2/Pages/PageLaunch/PageLoginJdycSkin.xaml'
      - 'Plain Craft Launcher 2/Pages/PageLaunch/PageLoginJdycSkin.xaml.vb'
      - 'Plain Craft Launcher 2/Pages/PageSetup/PageSetupLaunch.xaml'
      - 'Plain Craft Launcher 2/Pages/PageSetup/PageSetupLeft.xaml'
      - 'Plain Craft Launcher 2/Pages/PageSetup/PageSetupLeft.xaml.vb'
      - 'Plain Craft Launcher 2/Pages/PageSetup/PageSetupJdyc.xaml'
      - 'Plain Craft Launcher 2/Pages/PageSetup/PageSetupJdyc.xaml.vb'
      - 'Plain Craft Launcher 2/Plain Craft Launcher 2.vbproj'
      - 'jdyc-plugin/jdyc-pcl-bridge.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Update Help
        run: |
          Set-Location ..
          git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
          Set-Location PCL2Help
          Remove-Item -Path *.* -Recurse -Force
          Compress-Archive -Path .\* -DestinationPath .\Help.zip
          Copy-Item -Path .\Help.zip -Destination "${{ github.workspace }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
          Set-Location ..
          Remove-Item PCL2Help -Recurse -Force
          Set-Location ${{ github.workspace }}

      - name: Replace
        run: |
          (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")', 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "${{ secrets.CLIENT_ID }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
          (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")', 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
          (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"

      - name: Restore NuGet Packages
        run: dotnet restore PCLCS\PCLCS.csproj

      - name: Build
        run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.99.0.1-jdyc-skin
          name: 2.99.0.1 皮肤站版
          body: |
            基于上游 Meloong-Git/PCL 2.99.0.1，恢复 MC 下载功能，并接入揭东一初皮肤站（mcskin.jdyc.top）。

            改动：
            - MC 下载已恢复（RestrictMcDownload = False），内部版本号保持 2.99.0.1 不变。
            - 启动时弹出不可关闭的皮肤站登录窗口：已注册并完成学生认证的用户走 OAuth 登录，未注册的只打开皮肤站注册页、窗口继续挡着；登录成功后自动配置「我校皮肤站登陆」，服务器写死为 mcskin.jdyc.top，无需手动填 authlib 地址和账号。
            - 启动页新增「皮肤站」登录方式，启动时通过皮肤站插件签发 Yggdrasil 会话（Authlib-Injector 方式）。
            - 设置新增「皮肤站」页：显示皮肤站账号、邮箱、学生认证状态，角色下拉选择，皮肤预览，换皮肤/披风、清除、上传 PNG 皮肤/披风。
            - 离线登录默认关闭：设置里打开后才在启动页显示离线选项；正版和皮肤站登录不受影响。

            皮肤站端需安装附带的 jdyc-pcl-bridge 插件（已在皮肤站启用）：它在服务器端完成 OAuth 换 token（Secret 不进启动器）、学生认证校验、Yggdrasil 会话签发和材质上传。

            本发布版由本仓库 GitHub Actions 编译。
          files: |
            Plain Craft Launcher 2\obj\Release\Plain Craft Launcher 2.exe
            jdyc-plugin/jdyc-pcl-bridge.zip
          draft: false
          prerelease: false
